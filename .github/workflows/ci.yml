name: Rally CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: PostgreSQL tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rally -d rally_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rally:rally@127.0.0.1:5432/rally_test
      TEST_DATABASE_URL: postgresql+psycopg://rally:rally@127.0.0.1:5432/rally_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
      - run: python -m alembic check
      - name: Verify clean migration rollback and reapply on disposable CI database
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

  browser:
    name: Browser workflows with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rally -d rally_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RALLY_E2E_DATABASE_URL: postgresql+psycopg://rally:rally@127.0.0.1:5432/rally_e2e_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: npm ci
      - name: Prepare Python environment used by the browser test servers
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 7

  containers:
    name: Docker build and smoke test
    needs: [frontend, backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rally-ci
      RALLY_ALLOW_TEST_DATA: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait frontend
      - run: node scripts/ci-smoke.mjs
      - name: Verify a database backup can restore into a fresh database
        run: |
          backup_file=$(node scripts/backup.mjs --development)
          node scripts/check-backup.mjs "$backup_file"
      - name: Check production proxy and sign-in rate limiting
        run: |
          docker run -d --name rally-rate-limit-check --network rally-ci_default -p 127.0.0.1:8082:80 \
            --mount "type=bind,source=$PWD/deploy/nginx.production.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            rally-ci-frontend
          node scripts/check-rate-limit.mjs
      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and database volume
        if: always()
        run: |
          docker rm -f rally-rate-limit-check || true
          docker compose down --volumes
