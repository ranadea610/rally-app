# Only the private Caddy edge can reach this service. Caddy supplies trusted XFF.
limit_req_zone $http_x_forwarded_for zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location = /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/register;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
